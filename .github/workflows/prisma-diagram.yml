name: PRISMA diagram
on:
  push:
    paths:
      - src/render_prisma.R
      - session_04/prisma_official_input.csv
      - .github/workflows/prisma-diagram.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: prisma-R-release-v1
      - name: Install renderer system dependency
        run: sudo apt-get install -y pandoc
      - name: Install official diagram package
        run: Rscript -e 'if (!requireNamespace("PRISMA2020", quietly=TRUE)) install.packages("PRISMA2020", repos=Sys.getenv("RSPM"))'
      - name: Generate official-package diagrams
        run: Rscript src/render_prisma.R
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-official-diagram
          path: session_04/prisma_official/
